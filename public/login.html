<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eclipse Panel - Login · Made by Vexezor</title>
  <link rel="icon" type="image/png" href="./assets/logo.png"/>
  <link rel="alternate icon" type="image/jpeg" href="./assets/logo.jpg"/>
  
  <!-- System & Web Font Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/eclipse.css"/>
  <link rel="stylesheet" href="/css/eclipse.css"/>
  <script src="./js/eclipse-animations.js"></script>
  <script src="/js/eclipse-animations.js"></script>

  <style>
    /* 100% Self-Contained Bulletproof Base Styles (Guarantees dark theme & zero Times New Roman) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #040814;
      --bg-card: #251f30;
      --authA: #040814;
      --authB: #251f30;
      --authC: #2b2f3e;
      --authD: #3a435c;
      --authE: #e18989;
      --authF: #4f6295;
      --authG: #47526a;
      --authH: #e9eaee;
      --primary: #06b6d4;
      --emerald: #2cdd2f;
      --text-main: #f8fafc;
      --text-secondary: #c7c9cc;
      --text-muted: #8e9095;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Video Background */
    .video-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .video-bg-media {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%) scale(1.02);
      object-fit: cover;
      filter: brightness(0.48) contrast(1.15) saturate(1.2);
    }

    .video-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, rgba(6, 7, 10, 0.4) 0%, rgba(6, 7, 10, 0.88) 100%),
                  linear-gradient(180deg, rgba(6, 7, 10, 0.6) 0%, #06070A 100%);
    }

    .ambient-radial-glow {
      position: absolute;
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(6, 182, 212, 0.08) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card {
      background: var(--authB) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 10px !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      background: var(--bg-card);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 22px;
      padding: 38px 32px 28px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(6, 182, 212, 0.22);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      border-color: rgba(6, 182, 212, 0.55);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.9), 0 0 50px rgba(6, 182, 212, 0.32);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-logo-large {
      width: 78px;
      height: 78px;
      max-width: 78px;
      max-height: 78px;
      border-radius: 20px;
      object-fit: contain;
      margin: 0 auto 16px;
      display: block;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.6), 0 0 20px rgba(6, 182, 212, 0.4);
      border: 1.5px solid rgba(6, 182, 212, 0.5);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand-logo-large:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .bold-gradient-title {
      background: linear-gradient(135deg, #FFFFFF 20%, #22D3EE 60%, #22D3EE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #D8B4FE;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-weight: 500;
    }

    .tab-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(6, 7, 10, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
      gap: 4px;
    }

    .tab-btn {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25) 0%, rgba(139, 92, 246, 0.35) 100%);
      color: #FFFFFF;
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
    }

    .tab-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: #64748B;
      pointer-events: none;
    }

    .input-control {
      background: var(--authC) !important;
      border-bottom: 5px solid var(--authD) !important;
      border-radius: 4px !important;
      width: 100%;
      background: rgba(6, 7, 10, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      color: #FFFFFF;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--neon-violet);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.35);
    }

    .input-control::placeholder {
      color: #475569;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .toggle-pass-btn:hover {
      color: var(--neon-violet);
    }

    .toggle-pass-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-submit {
      background: var(--authF) !important;
      color: var(--authH) !important;
      border-radius: 10px !important;
      border: none !important;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #22D3EE 0%, #0891B2 100%);
      border: 1px solid rgba(6, 182, 212, 0.6);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #22D3EE 0%, #9333EA 100%);
      box-shadow: 0 12px 35px rgba(6, 182, 212, 0.55);
      transform: translateY(-2px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .card-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #64748B;
    }

    .status-dot-emerald {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      display: inline-block;
      margin-right: 6px;
    }

    /* Floating Alert */
    .auth-alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      font-family: var(--font-sans);
    }
    .auth-alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      display: flex;
    }
    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
      display: flex;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  

  <div class="login-container">
    <div class="login-card" id="login-card-tilt">
      <!-- Brand Header -->
      <div class="brand-header">
        <img src="./assets/logo.png" onerror="this.src='./assets/logo.jpg'" alt="Eclipse Panel Logo" class="brand-logo-large" />
        <div class="brand-title">
          <span class="bold-gradient-title">ECLIPSE PANEL</span>
          <span class="brand-badge">:8090</span>
        </div>
        <p class="brand-subtitle">High-Performance Node.js & Python Daemon Matrix</p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="auth-alert"></div>

      <!-- Tab Switcher -->
      <div class="tab-group">
        <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">
          <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10zM4 19h4v2H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h4v2H4v14zm16-16h-4v2h4v14h-4v2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          Sign In
        </button>
        <button type="button" class="tab-btn" id="tab-register" onclick="switchTab('register')">
          <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Register Operator
        </button>
      </div>

      <!-- Form -->
      <form id="auth-form" onsubmit="event.preventDefault(); handleSubmit();">
        <div class="form-group">
          <label class="form-label" for="username">Operator Identity</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="text" id="username" class="input-control" placeholder="Operator username or email" required autocomplete="username">
          </div>
        </div>

        <div class="form-group" id="email-group" style="display: none;">
          <label class="form-label" for="email">Operator Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="email" id="email" class="input-control" placeholder="operator@eclipse.io" autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Master Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="password" class="input-control" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
              <svg id="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span id="btn-text">Authenticate & Access Console</span>
          <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </form>

      <!-- Footer Metadata -->
      <div class="card-footer">
        <div>
          <span class="status-dot-emerald"></span>
          <span>Daemon Core v2.4</span>
        </div>
        <div>Multi-Node Cluster Ready</div>
      </div>
      
      <!-- Official Nebula Theme Watermark (demo.nebula.style/authWatermark.css) -->
      <div class="eclipse-watermark" style="text-align: center; font-size: 11.5px; color: #64748B; font-family: var(--font-mono); margin-top: 30px; padding: 10px;">Eclipse Panel © 2026 &middot; Cloud Container Infrastructure &middot; <strong style="color: #06B6D4;">Made By Vexezor</strong></div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    const API_BASE = window.location.origin + '/api';

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('auth-alert');
      el.className = 'auth-alert ' + type;
      el.innerText = msg;
      el.style.display = 'flex';
    }

    function hideAlert() {
      const el = document.getElementById('auth-alert');
      el.style.display = 'none';
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
      }
    }

    function switchTab(mode) {
      hideAlert();
      isRegisterMode = (mode === 'register');
      document.getElementById('tab-login').className = isRegisterMode ? 'tab-btn' : 'tab-btn active';
      document.getElementById('tab-register').className = isRegisterMode ? 'tab-btn active' : 'tab-btn';
      document.getElementById('email-group').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('btn-text').innerText = isRegisterMode ? 'Register Operator Account' : 'Authenticate & Access Console';

      if (isRegisterMode) {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
      }
    }

    async function handleSubmit() {
      hideAlert();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn-submit');
      const origText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = 'Connecting to Daemon...';

      try {
        const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
        const payload = isRegisterMode 
          ? { username, email: email || (username + '@eclipse.local'), password }
          : { login: username, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication rejected by security policy');

        localStorage.setItem('eclipse_token', data.token);
        localStorage.setItem('eclipse_user', JSON.stringify(data.user));

        showAlert('Authorized! Access Granted. Redirecting...', 'success');
        btn.innerHTML = 'Authorized! Redirecting...';
        setTimeout(() => { window.location.href = '/'; }, 350);
      } catch (err) {
        showAlert(err.message, 'error');
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
