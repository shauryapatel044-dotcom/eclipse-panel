<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eclipse Panel - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0B0E;
      --card-bg: #12141A;
      --card-border: #2D1519;
      --input-bg: #0D0E11;
      --input-border: #262933;
      --primary: #EF4444;
      --primary-hover: #DC2626;
      --primary-glow: rgba(239, 68, 68, 0.25);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --accent-emerald: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, rgba(10, 11, 14, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Login Card Container */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px var(--primary-glow);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(16px);
      transition: border-color 0.3s ease;
    }

    .login-card:hover {
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon-box {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #DC2626 0%, #450A0A 100%);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35);
    }

    .brand-icon-box svg {
      width: 28px;
      height: 28px;
      color: #FFFFFF;
      fill: currentColor;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Tab Switcher */
    .tab-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .tab-btn {
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .tab-btn.active {
      background: #1E222D;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .tab-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Superadmin Alert */
    .admin-notice {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    .admin-notice svg {
      width: 16px;
      height: 16px;
      fill: #EF4444;
      flex-shrink: 0;
    }

    .admin-notice strong {
      color: #F87171;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: #64748B;
      pointer-events: none;
    }

    .input-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 11px 14px 11px 38px;
      font-size: 14px;
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
    }

    .input-control::placeholder {
      color: #475569;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #F87171 0%, #EF4444 100%);
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.5);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Footer Metadata */
    .card-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748B;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      display: inline-block;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="login-card">
    <!-- Brand -->
    <div class="brand-header">
      <div class="brand-icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <div class="brand-title">
        <span>ECLIPSE PANEL</span>
        <span class="brand-badge">PORT 8090</span>
      </div>
      <p class="brand-subtitle">Python & Node.js Hosting Daemon Control Matrix</p>
    </div>

    <!-- Tabs -->
    <div class="tab-group">
      <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">
        <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10zM4 19h4v2H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h4v2H4v14zm16-16h-4v2h4v14h-4v2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        Sign In
      </button>
      <button type="button" class="tab-btn" id="tab-register" onclick="switchTab('register')">
        <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Register
      </button>
    </div>

    <!-- Form -->
    <form id="auth-form" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <label class="form-label" for="username">Operator Identity</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" id="username" class="input-control" placeholder="Username or operator email" required autocomplete="username">
        </div>
      </div>

      <div class="form-group" id="email-group" style="display: none;">
        <label class="form-label" for="email">Gmail / Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="email" class="input-control" placeholder="operator@gmail.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Master Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="password" class="input-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        <span id="btn-text">Authenticate & Access Console</span>
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
    </form>

    <!-- Footer -->
    <div class="card-footer">
      <div>
        <span class="status-dot"></span>
        <span>Daemon Active</span>
      </div>
      <div>MariaDB :3306</div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    const API_BASE = window.location.origin + '/api';

    function switchTab(mode) {
      isRegisterMode = (mode === 'register');
      document.getElementById('tab-login').className = isRegisterMode ? 'tab-btn' : 'tab-btn active';
      document.getElementById('tab-register').className = isRegisterMode ? 'tab-btn active' : 'tab-btn';
      document.getElementById('email-group').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('btn-text').innerText = isRegisterMode ? 'Register Operator Account' : 'Authenticate & Access Console';

      if (isRegisterMode) {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
      }
    }

    async function handleSubmit() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn-submit');
      const origText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = 'Connecting...';

      try {
        const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
        const payload = isRegisterMode 
          ? { username, email: email || (username + '@eclipsepanel.local'), password }
          : { login: username, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed');

        localStorage.setItem('eclipse_token', data.token);
        localStorage.setItem('eclipse_user', JSON.stringify(data.user));

        btn.innerHTML = 'Authorized! Redirecting...';
        setTimeout(() => { window.location.href = '/'; }, 400);
      } catch (err) {
        alert(err.message);
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
